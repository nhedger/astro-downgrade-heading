name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Biome
        run: pnpm exec biome ci .
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Build package
        run: pnpm build
      - name: Compute new version
        id: version
        run: |
          VERSION=$(pnpm exec git-cliff --config .github/changelog.cliff.toml --bumped-version)
          VERSION=${VERSION#v}
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" = "$CURRENT_TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    name: Generate changelog
    needs: version
    if: needs.version.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate full changelog
        run: |
          pnpm exec git-cliff \
            --config .github/changelog.cliff.toml \
            --tag "v${{ needs.version.outputs.version }}" \
            --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release notes
        run: |
          pnpm exec git-cliff \
            --config .github/release-notes.cliff.toml \
            --unreleased \
            --tag "v${{ needs.version.outputs.version }}" \
            --strip all \
            --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload changelog artifacts
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md

  release:
    name: Release
    needs: [version, changelog]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Update package version
        run: pnpm pkg set version=${{ needs.version.outputs.version }}
      - name: Download changelog artifacts
        uses: actions/download-artifact@v8
        with:
          name: changelog
      - name: Create signed release commit and tag
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY must be configured."
            exit 1
          fi

          SIGNING_KEY="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$SIGNING_KEY"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$SIGNING_KEY"

          git add CHANGELOG.md package.json
          git \
            -c user.name="Nicolas Hedger" \
            -c user.email="649677+nhedger@users.noreply.github.com" \
            -c gpg.format=ssh \
            -c user.signingkey="$SIGNING_KEY" \
            commit -S \
            -m "chore(release): v${{ needs.version.outputs.version }}" \
            -m "[skip ci]"
          git \
            -c user.name="Nicolas Hedger" \
            -c user.email="649677+nhedger@users.noreply.github.com" \
            -c gpg.format=ssh \
            -c user.signingkey="$SIGNING_KEY" \
            tag -s "v${{ needs.version.outputs.version }}" -m "Release v${{ needs.version.outputs.version }}"

          git push --atomic origin HEAD:main "v${{ needs.version.outputs.version }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          make_latest: true
          body_path: RELEASE_NOTES.md
